function renderList(){const rows=filtered();$('#list').innerHTML='<p class="muted">显示 '+rows.length+' / 50 · 已选 '+Object.values(notes).filter(n=>n.selected).length+'</p>'+rows.map(r=>`<button class="sample ${r.blind_id===current?'active':''}" data-id="${r.blind_id}">${notes[r.blind_id]?.selected?'★ ':''}${r.blind_id} · ${grade(r)}<span>${esc(r.game)} · 原样本 ${r.sample_number}${notes[r.blind_id]?.note?' · 有批注':''}</span></button>`).join('');$('#list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;renderDetail();renderList()})}
function entries(rows,fn){return rows.map(x=>'<div class="entry">'+fn(x)+'</div>').join('')}
function renderDetail(){const r=DATA.find(x=>x.blind_id===current),n=notes[current]||{};$('#detail').innerHTML=`<h2>${r.blind_id} · ${esc(r.game)} <span class="badge">构图：${grade(r)}</span></h2><div class="columns"><div><video controls preload="metadata" src="${esc(r.video)}"></video><p class="muted">网页视频为压缩预览，截帧保留原图。原样本 ${r.sample_number} · 片内时间 0–20 秒 · 原会话起点 ${time(r.source_start)}</p><div class="box"><h3>截帧证据</h3><p class="muted">时间码为片内时间；点击图片查看原尺寸。</p><div class="case-frames">${(r.evidence||[]).map(e=>{const src='composition-eval/operator-run-50-v1/inputs/'+r.blind_id+'/frames/frame-'+String(e.frame_index+1).padStart(4,'0')+'.jpg';return `<figure><a href="${src}" target="_blank"><img loading="lazy" src="${src}" alt="${r.blind_id} 第${e.frame_index}帧"></a><figcaption>${time(e.frame_index/4)} · 第${e.frame_index}帧<br>${esc(e.observation)}</figcaption></figure>`}).join('')}</div><details class="sequence"><summary>展开完整序列图（4 FPS，带时间码）</summary>${[1,2].map(i=>`<a target="_blank" href="composition-eval/operator-run-50-v1/inputs/${r.blind_id}/input-${i}.jpg"><img loading="lazy" src="composition-eval/operator-run-50-v1/inputs/${r.blind_id}/input-${i}.jpg" alt="${r.blind_id} 序列图${i}"></a>`).join('')}</details></div><div class="box"><h3>机标总评</h3><p>${esc(r.summary)}</p></div><div class="box"><h3>你的批注与样本选择</h3><label><input type="checkbox" id="selected" ${n.selected?'checked':''}> 挑选此样本</label><label><input type="checkbox" id="review" ${n.review?'checked':''}> 需要讨论 / 复核</label><label>我的复核档位（不修改机标）<select id="humanGrade"><option value="">暂不判断</option>${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${n.grade===v?'selected':''}>${l}</option>`).join('')}</select></label><label>批注 / 挑选理由<textarea id="note" placeholder="记录时间码、画面依据、分歧或样本用途…">${esc(n.note||'')}</textarea></label><button id="stamp">插入当前播放时间</button><p class="muted">批注自动保存在当前浏览器。建议导出 JSON 备份；此页不读取原人工初标答案。</p></div><details class="box"><summary>画面事件与证据（点击时间跳转）</summary>${entries(r.unique_events||[],e=>`<button data-time="${e.time_range?.[0]||0}">${esc(e.event_id)} · ${(e.time_range||[]).map(time).join('–')}</button><p>${esc(e.observation)}</p><p>${esc(e.impact)}</p>`)}${entries(r.evidence||[],e=>`<button data-time="${e.frame_index/4}">第 ${e.frame_index} 帧 · ${time(e.frame_index/4)}</button><p>${esc(e.observation)} ${esc(e.impact)}</p>`)}</details></div><div><div class="box"><h3>评价因素 · 按主体与时段诊断</h3>${entries(r.factor_diagnostics||[],f=>`<strong>${esc(factors[f.factor_id]||f.factor_id)} · ${grade(f)}</strong><p class="muted">${(f.time_range||[]).map(time).join('–')} ${esc(f.subject_id||'整体画面')}</p><p>${esc(f.summary)}</p>`)}</div><details class="box"><summary>12 项可观测指标</summary>${entries(r.indicator_assessments||[],i=>`<strong>${esc(INDICATORS[i.indicator_id]||i.indicator_id)} · ${esc(i.effect)}</strong><p>${esc(i.evidence)}</p>`)}</details><details class="box"><summary>构图手法 · 识别与实际效果</summary>${entries(r.technique_evidence||[],t=>`<strong>${esc(t.technique)} · ${esc(t.recognition)}${t.effect?' / '+esc(t.effect):''}</strong><p>${esc(t.effect_reason)}</p>`)}</details><details class="box"><summary>测量复核与不确定项</summary><p>${esc(r.measurement_qa?.summary)}</p>${entries(r.measurement_qa?.rejections||[],x=>`<p>${esc(x.object_id)} · ${esc(x.scope)} · 帧 ${esc((x.frame_indices||[]).join(', '))}</p><p>${esc(x.reason)}</p>`)}${(r.uncertainties||[]).map(x=>'<p>• '+esc(x)+'</p>').join('')}</details><details class="box"><summary>原始机标 JSON</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details></div></div>`;
function update(){notes[current]={...notes[current],selected:$('#selected').checked,review:$('#review').checked,grade:$('#humanGrade').value,note:$('#note').value,updated_at:new Date().toISOString()};save()}
['selected','review','humanGrade'].forEach(id=>$('#'+id).onchange=update);$('#note').oninput=update;$('#stamp').onclick=()=>{$('#note').value+=($('#note').value?'\n':'')+'['+time($('video').currentTime)+'] ';update();$('#note').focus()};$('#detail').querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{$('video').currentTime=Number(b.dataset.time);$('video').scrollIntoView({block:'nearest'})});$('#detail').scrollTop=0}
const INDICATORS={'subject-position':'主体所在位置','subject-area':'主体画面占比','subject-occlusion':'主体被遮挡程度','subject-separation':'主体背景区分','shot-crop-joint':'关节截断','shot-crop-headroom':'头部空间','shot-crop-look-room':'视线空间','shot-crop-lead-room':'运动前方空间','shot-crop-action-crop':'动作裁切','spatial-depth':'纵深层次','spatial-vertical':'上下分布','spatial-overlap':'重叠关系'};
const counts={high:0,middle:0,low:0,uncertain:0,not_applicable:0};DATA.forEach(r=>counts[r.grade||r.status]++);$('#stats').innerHTML=Object.entries(counts).map(([g,c])=>`<div class="stat">${labels[g]} <strong>${c}</strong> <small>${c*2}%</small><div class="bar" style="width:${c*2}%"></div></div>`).join('');['search','grade','scope'].forEach(id=>$('#'+id).oninput=renderList);
function download(selected){const rows=DATA.filter(r=>!selected||notes[r.blind_id]?.selected);if(!rows.length){$('#notice').textContent='请先挑选样本';return}const blob=new Blob([JSON.stringify({version:1,dimension:'构图',exported_at:new Date().toISOString(),selected_only:selected,results:rows.map(r=>({machine:r,review:notes[r.blind_id]||{}}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=selected?'构图-所选样本.json':'构图-50条机标与批注.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#export').onclick=()=>download(false);$('#exportSelected').onclick=()=>download(true);$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.dimension!=='构图'||!Array.isArray(d.results))throw Error();for(const x of d.results){const id=x.machine?.blind_id;if(DATA.some(r=>r.blind_id===id&&r.id===x.machine.id)&&x.review&&Object.keys(x.review).length)notes[id]=x.review}save();renderDetail();$('#notice').textContent='批注已导入'}catch{$('#notice').textContent='导入失败，请选择本页导出的 JSON'}e.target.value=''};renderList();renderDetail();
</script></html>
