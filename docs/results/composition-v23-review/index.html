<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>构图 v2.3 · 50题审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#203a4b;font:15px/1.65 system-ui}header{padding:16px 24px;background:white;border-bottom:1px solid #d7e1e8;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:22px;margin:0}a{color:#176784}button,select,input,textarea{font:inherit;border:1px solid #b9ccd8;border-radius:7px;padding:8px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8f3f8}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:175px minmax(0,1.05fr) minmax(0,1fr);height:calc(100vh - 104px)}aside,.left,.right{overflow:auto;padding:18px}aside{border-right:1px solid #d7e1e8}aside button{display:block;width:100%;text-align:left;margin-bottom:7px}.active{background:#d2eee8!important;border-color:#429b89}video{width:100%;background:#000;border-radius:10px;max-height:55vh}.card,details{background:white;border:1px solid #d8e3ea;border-radius:10px;padding:15px;margin:12px 0}summary{cursor:pointer;font-weight:650}h2{font-size:20px}h3{font-size:17px;margin:10px 0}p{margin:8px 0}.muted{color:#69808e;font-size:13px}textarea{width:100%;min-height:130px}.frames{display:flex;gap:10px;overflow:auto;padding:8px 0}.frames figure{margin:0;min-width:185px;width:185px}.frames img{width:185px;border-radius:5px}.frames button{font-size:12px;padding:3px 8px}figcaption{font-size:12px}.wide{width:100%;height:auto}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:500px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid #dce6ec;padding:7px;text-align:left;vertical-align:top}.scroll{overflow:auto}.grade{font-size:24px;font-weight:700;color:#167a69}.note{background:#fff5dc;padding:10px;border-radius:7px}.hidden{display:none!important}@media(max-width:950px){.layout{grid-template-columns:110px 1fr;height:auto}.right{grid-column:2}.left,.right{overflow:visible}header{align-items:flex-start;flex-direction:column}aside{grid-row:1/3;max-height:85vh;position:sticky;top:0}.tools{font-size:13px}}
</style><header><div><h1>构图 v2.3 · 50题审核</h1><div class="muted"><a href="../../index.html">项目首页</a> · <a href="../../rubrics/composition_rubric_v2.html" target="_blank">完整 Rubric</a> · 27高 / 20中 / 3低 · 机标结果固定保存</div></div><div class="tools"><label><input id="blind" type="checkbox" checked> 隐藏机标，先人工复核</label><button id="export">导出批注</button><button id="import">导入批注</button><input id="file" type="file" accept="application/json" hidden><button id="prev">← 上一题</button><span id="position"></span><button id="next">下一题 →</button></div></header><div class="layout"><aside><input id="search" placeholder="搜索R编号" style="width:100%"><select id="filter" style="width:100%;margin:8px 0"><option value="">全部样本</option value="pending">未复核</option value="reviewed">已复核</option value="selected">已挑选</option value="high">机标高</option value="middle">机标中</option value="low">机标低</option></select><div id="list"></div></aside><main class="left" id="left"></main><section class="right" id="right"></section></div><script>
const KEY='composition-v23-clean50-review-v1',grades={high:'高',middle:'中',low:'低',uncertain:'无法判断',not_applicable:'不适用'},states={met:'满足',not_met:'不满足',insufficient_evidence:'证据不足',not_applicable:'不适用'};let data=[],current='R01',reviews={};try{reviews=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pretty=x=>esc(JSON.stringify(x,null,2));
function seen(){return reviews[current]||(reviews[current]={})}function save(){localStorage.setItem(KEY,JSON.stringify(reviews));renderList()}
function frames(ids,c){const indexes=new Set();for(const id of ids||[]){const m=String(id).match(/(?:rgb|measure)-(\d+)/);if(m)indexes.add(+m[1]);}return '<div class="frames">'+c.frames.filter(f=>indexes.has(f.frame_index)).map(f=>`<figure><a href="${f.url}" target="_blank"><img loading="lazy" src="${f.url}" alt="${c.id} ${f.time}秒原始截图"></a><figcaption>${f.time.toFixed(2)}秒 · #${f.frame_index}</figcaption><button data-copy="${f.url}">复制截图</button> <button data-time="${f.time}">定位视频</button></figure>`).join('')+'</div>'}
function rows(xs,cols){return '<div class="scroll"><table><thead><tr>'+cols.map(([k,t])=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+xs.map(x=>'<tr>'+cols.map(([k])=>'<td>'+esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function filtered(){const q=el('search').value.toLowerCase(),f=el('filter').value;return data.filter(c=>c.id.toLowerCase().includes(q)&&(!f||(f==='pending'?!reviews[c.id]?.grade:f==='reviewed'?!!reviews[c.id]?.grade:f==='selected'?!!reviews[c.id]?.selected:c.prediction.overall.grade===f)))}
function renderList(){el('list').innerHTML=filtered().map(c=>`<button data-id="${c.id}" class="${c.id===current?'active':''}">${c.id} ${reviews[c.id]?.grade?'✓':''}${reviews[c.id]?.selected?' ★':''}<div class="muted">${el('blind').checked?'机标已隐藏':grades[c.prediction.overall.grade]||c.prediction.overall.status}</div></button>`).join('');el('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id));}
function go(id){current=id;history.replaceState(null,'','#'+id);render()}
function render(){const c=data.find(x=>x.id===current),p=c.prediction,r=seen(),blind=el('blind').checked;el('position').textContent=current+' / 50';el('prev').disabled=current==='R01';el('next').disabled=current==='R50';el('left').innerHTML=`<h2>${c.id} · ${esc(c.game)} · 原样本 ${c.original}</h2><video id="video" src="${c.video}" controls preload="metadata"></video><p class="muted">片内0–20秒 · 原会话起点 ${c.source_start.toFixed(2)}秒。网页视频为现有压缩预览；证据截图来自本轮模型输入。</p><details><summary>实际输入序列与原始截图</summary><p>2FPS基础采样，局部4FPS补帧；下列为实际提供的有序帧。</p><a href="${c.id}/input-sequence.jpg" target="_blank"><img class="wide" loading="lazy" src="${c.id}/input-sequence.jpg"></a>${frames(c.frames.map(f=>'rgb-'+String(f.frame_index).padStart(4,'0')),c)}</details>`;
 el('right').innerHTML=`<div class="card"><h3>人工复核</h3><p class="muted">批注自动保存在当前浏览器，请导出备份。隐藏机标仅辅助先评；此前看过的样本应注明。</p><label>人工档位 <select id="human"><option value="">尚未复核</option>${Object.entries(grades).map(([v,t])=>`<option value="${v}" ${r.grade===v?'selected':''}>${t}</option>`).join('')}</select></label><p><label><input type="checkbox" id="selected" ${r.selected?'checked':''}> 挑选为示例</label>　<label><input type="checkbox" id="familiar" ${r.familiar?'checked':''}> 此前看过／非盲评</label></p><textarea id="note" placeholder="人工判断、画面依据、误判原因……">${esc(r.note||'')}</textarea><p><button id="reveal">${blind?'查看本题机标（记录已查看）':'隐藏机标'}</button></p></div><div id="machine" class="${blind?'hidden':''}"><div class="card"><div class="grade">机器判档：${grades[p.overall.grade]||esc(p.overall.status)}</div><p>${esc(p.overall.reason)}</p><h3>为什么不是相邻档</h3><p>${esc(p.overall.adjacent_grade_explanation)}</p><p>整体条件：${esc(p.overall.condition_ids?.join('、'))}</p><details><summary>不确定性与限制</summary>${(p.overall.uncertainties||[]).map(x=>'<p>'+esc(x)+'</p>').join('')}</details></div><details><summary>① 主体、陪体与环境提取</summary>${rows(p.roles,[['object_id','对象'],['role','角色'],['time_range','时间'],['description','依据'],['uncertainty','不确定']])}</details><details><summary>② 阶段切分与当前观看任务</summary>${p.stages.map(s=>`<h3>${esc(s.stage_id)} · ${esc(s.time_range)}</h3><p>${esc(s.necessary_information)}</p>${frames(s.input_evidence_ids,c)}`).join('')}</details><details><summary>③ 分割核验与测量</summary><p class="note">CV测量使用既有缓存；分割不是标答。模型拒绝的掩码及派生值不得作为判档依据。</p><a href="${c.id}/mask-qa.jpg" target="_blank"><img class="wide" loading="lazy" src="${c.id}/mask-qa.jpg"></a>${rows(p.segmentation_review,[['measurement_id','测量ID'],['accepted','是否采用'],['reason','核验理由']])}<p><a href="${c.id}/raw-measurements.json" target="_blank">完整原始测量值JSON</a> · <a href="${c.id}/model-evidence.json" target="_blank">实际提交的测量证据JSON</a></p><details id="measure-details"><summary>展开模型实际获得的测量值</summary><pre id="measure-values">展开后加载</pre></details></details><details open><summary>④ 事件证据链：画面 → 影响</summary>${p.events.map(e=>`<div class="card"><h3>${esc(e.event_id)} · ${esc(e.time_ranges)}</h3>${frames(e.input_evidence_ids,c)}<p><b>观察：</b>${esc(e.observation)}</p><p><b>作用／影响：</b>${esc(e.effect)}</p><p><b>排除合理例外：</b>${esc(e.exceptions_checked)}</p></div>`).join('')}</details><details><summary>⑤ 14项指标如何对应规则</summary>${p.indicators.map(i=>`<div class="card"><h3>${esc(i.indicator_id)}</h3><p>基础：${states[i.baseline]||esc(i.baseline)} · 增强：${states[i.enhancement]||esc(i.enhancement)}</p><p>条件：${esc(i.condition_ids?.join('、'))} · 事件：${esc(i.event_ids?.join('、'))}</p><p>${esc(i.uncertainty)}</p></div>`).join('')}</details><details><summary>⑥ 时序对照与整体表达</summary>${p.temporal_analysis.map(t=>`<div class="card"><h3>之前</h3>${frames(t.before_evidence_ids,c)}<h3>之后</h3>${frames(t.after_evidence_ids,c)}<p><b>变化：</b>${esc(t.visible_change)}</p><p><b>空间／注意：</b>${esc(t.spatial_or_attention_effect)}</p><p><b>表达：</b>${esc(t.expressive_effect)}</p></div>`).join('')}</details><p><a href="${c.id}/prediction.json" target="_blank">完整机标JSON</a> · <a href="${c.id}/call/prompt.txt" target="_blank">实际提示词</a> · <a href="model-rubric-input.json" target="_blank">实际Rubric</a> · <a href="${c.id}/call/validation.json" target="_blank">结构校验</a></p></div>`;
 el('measure-details').ontoggle=async e=>{if(e.target.open){const response=await fetch(c.id+'/model-evidence.json');const value=await response.json();if(current===c.id)el('measure-values').textContent=JSON.stringify(value,null,2)}};
 el('human').onchange=e=>{r.grade=e.target.value;r.updated_at=new Date().toISOString();r.machine_seen_before_grade=!!r.machine_seen_at;save()};el('note').oninput=e=>{r.note=e.target.value;save()};el('selected').onchange=e=>{r.selected=e.target.checked;save()};el('familiar').onchange=e=>{r.familiar=e.target.checked;save()};el('reveal').onclick=()=>{if(el('blind').checked){r.machine_seen_at=new Date().toISOString();save()}el('blind').checked=!el('blind').checked;render()};if(!blind){r.machine_seen_at=r.machine_seen_at||new Date().toISOString();save()}
 document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{el('video').currentTime=+b.dataset.time});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{const img=new Image();img.src=b.dataset.copy;await img.decode();const cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;cv.getContext('2d').drawImage(img,0,0);const blob=await new Promise(ok=>cv.toBlob(ok,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);b.textContent='已复制'}catch{b.textContent='请打开原图复制'}});renderList();}
el('prev').onclick=()=>go(data[Math.max(0,data.findIndex(x=>x.id===current)-1)].id);el('next').onclick=()=>go(data[Math.min(49,data.findIndex(x=>x.id===current)+1)].id);el('blind').onchange=render;el('filter').onchange=renderList;el('search').oninput=renderList;
el('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'composition-v23-clean50-review-v1',exported_at:new Date().toISOString(),reviews},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='构图50题-人工复核.json';a.click();URL.revokeObjectURL(a.href)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==KEY||!d.reviews)throw Error('版本不匹配');for(const [k,v]of Object.entries(d.reviews)){if(!/^R(0[1-9]|[1-4][0-9]|50)$/.test(k)||!v||typeof v!=='object')throw Error('无效记录');}reviews={...reviews,...d.reviews};save();render()}catch(e){alert('导入失败：'+e.message)}};
fetch('data.json').then(r=>{if(!r.ok)throw Error('无法读取数据');return r.json()}).then(d=>{data=d;current=data.some(c=>c.id===location.hash.slice(1))?location.hash.slice(1):'R01';render()}).catch(e=>el('right').textContent=e.message+'。请通过HTTP服务打开页面。');
</script></html>
