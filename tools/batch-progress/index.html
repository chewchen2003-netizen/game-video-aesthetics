<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>构图 · 50条后台进度</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#223b48;font:15px/1.65 system-ui}main{max-width:1100px;margin:35px auto;padding:0 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:0}button{padding:9px 16px;border:1px solid #c2d2da;border-radius:9px;background:white;cursor:pointer;color:#315c6e}p{color:#6a7c87}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#fff;border:1px solid #e0e7eb;border-radius:12px;padding:18px 22px}.card small{display:block;color:#70838d}.card strong{display:block;font-size:32px;line-height:1.5}.bar{height:10px;border-radius:10px;background:#dae5eb;overflow:hidden;margin:15px 0}.bar span{display:block;height:100%;width:0;background:#2aa28e;transition:width .3s}.panel{background:white;border:1px solid #e0e7eb;border-radius:12px;padding:20px 24px;margin:18px 0}h2{font-size:17px;margin:0 0 12px}.meta{font-size:13px;color:#70838d}.status{display:inline-block;padding:3px 10px;border-radius:6px;background:#edf3f6}.complete{background:#e0f3ea;color:#247256}.failed{background:#fae8e5;color:#a73d36}.active{background:#e4f0fa;color:#28608f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.active-card{border:1px solid #dbe7ee;border-radius:8px;padding:14px}.active-card strong{font-size:19px}.active-card p{margin:8px 0;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #edf1f4}th{font-size:13px;color:#7b8c95;font-weight:500}.table{max-height:440px;overflow:auto}.error{color:#a13c36;font-size:13px;overflow-wrap:anywhere}#connection{font-size:13px}#error{display:none;background:#fff0ec;padding:12px 16px;border-radius:8px;color:#a13c36}select{font:inherit;padding:5px 10px;border:1px solid #d7e1e7;border-radius:6px}.table-head{display:flex;justify-content:space-between;align-items:center}.muted{color:#7b8c95}@media(max-width:700px){main{padding:0 15px;margin:20px auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:21px}}</style>
<main><header><div><h1>构图 · 50条后台进度</h1><div id="connection" class="muted">正在连接…</div></div><button id="refresh">立即刷新</button></header><p>本轮：基础2FPS，关键时段补4FPS；已重新计时。每15秒自动刷新；已完成的样本显示机标档位，未完成不预判。</p><div id="error" role="alert"></div><div class="cards"><div class="card"><small>已完成</small><strong id="done">— / 50</strong></div><div class="card"><small>处理中</small><strong id="active">—</strong></div><div class="card"><small>失败待检查</small><strong id="failed">—</strong></div><div class="card"><small>已运行</small><strong id="elapsed">—</strong></div></div><div class="bar"><span id="bar"></span></div><div class="meta" id="timestamps"></div>
<div class="panel"><h2>正在处理</h2><div class="grid" id="working"></div></div><div class="panel"><div class="table-head"><h2>全部样本</h2><select id="filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="active">处理中</option><option value="complete">已完成</option><option value="failed">失败</option></select></div><div class="table"><table><thead><tr><th>样本</th><th>阶段</th><th>机标档位</th><th>本阶段用时</th><th>进度说明</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="meta" id="footer"></p></main>
<script>let last=null,busy=false;const names={queued:'排队中',prepare:'准备输入',identify:'内容识别',measure:'分割与测量',judge:'VLM判档',complete:'已完成',failed:'失败待检查'};const activeStates=['prepare','identify','measure','judge'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function duration(seconds){if(seconds==null)return'—';const m=Math.floor(seconds/60);return m<60?m+'分':Math.floor(m/60)+'小时'+m%60+'分'}function clock(t){return t?new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false}):'—'}function paint(d){last=d;const cases=Object.entries(d.cases).filter(([id])=>/^R\d+$/.test(id)),active=cases.filter(([,v])=>activeStates.includes(v.state));document.querySelector('#done').textContent=d.completed+' / '+d.total;document.querySelector('#active').textContent=active.length;document.querySelector('#failed').textContent=d.failed;document.querySelector('#elapsed').textContent=duration(d.wall_elapsed_seconds);document.querySelector('#bar').style.width=(100*d.completed/d.total)+'%';document.querySelector('#connection').textContent=d.finished?'任务已结束':d.process_alive?'● 后台进程运行中':'● 后台进程未检测到，请检查';document.querySelector('#connection').style.color=d.process_alive||d.finished?'#247256':'#a13c36';document.querySelector('#timestamps').textContent='最近状态变化 '+clock(d.updated_epoch)+' · 看板读取 '+clock(d.read_epoch)+' · 剩余时间 '+(d.completed>=5?duration(d.estimated_remaining_seconds):'前5条完成后再估');document.querySelector('#working').innerHTML=active.length?active.map(([id,v])=>'<div class="active-card"><strong>'+esc(id)+'</strong> <span class="status active">'+esc(names[v.state])+'</span><p>本阶段 '+duration(d.read_epoch-v.epoch)+'</p><p>'+esc(v.detail||'正在处理，尚未产出最终结果')+'</p></div>').join(''):'<p class="muted">当前没有正在处理的样本</p>';const filter=document.querySelector('#filter').value;document.querySelector('#rows').innerHTML=cases.filter(([,v])=>filter==='all'||filter==='active'&&activeStates.includes(v.state)||v.state===filter).map(([id,v])=>'<tr><td>'+esc(id)+'</td><td><span class="status '+(activeStates.includes(v.state)?'active':v.state)+'">'+esc(names[v.state]||v.state)+'</span></td><td>'+(v.state==='complete'?esc(({high:'高',middle:'中',low:'低'}[v.grade])||({uncertain:'无法判断',not_applicable:'不适用'}[v.status])||'待整理'):'—')+'</td><td>'+(!v.epoch||v.state==='queued'?'—':v.state==='complete'?'已完成':duration(d.read_epoch-v.epoch))+'</td><td class="'+(v.state==='failed'?'error':'')+'">'+esc(v.error||(v.state==='complete'?'已通过校验':v.detail||'—'))+'</td></tr>').join('');document.querySelector('#footer').textContent='规则 v'+d.rubric_version+' · 模型最多2路并发 / CV测量1路 · 完成数仅统计已通过校验的结果；过程中的测量帧数不代表视频已判档。'}async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/progress?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('读取失败 '+r.status);paint(await r.json());document.querySelector('#error').style.display='none'}catch(e){const el=document.querySelector('#error');el.textContent='暂时无法读取进度：'+e.message+'。此处不是最新数据。';el.style.display='block'}finally{busy=false}}document.querySelector('#refresh').onclick=refresh;document.querySelector('#filter').onchange=()=>{if(last)paint(last)};refresh();setInterval(refresh,15000);</script></html>
